# Checks the live site every 6 hours: pages, the enquiry form, the chat.
# A failed run makes GitHub email the repo owner. See scripts/uptime-check.mjs
# for what each check catches and why it exists.
#
# GitHub pauses scheduled workflows in a repo with no activity for 60 days;
# it emails before it does, and "Enable workflow" on the Actions tab restarts it.
name: Uptime check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/uptime-check.mjs
